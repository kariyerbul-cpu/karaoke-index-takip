name: Karaoke Google Indeks Durumu

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'  # 10:15 Türkiye saati, UTC+3

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt
      - name: Google Search Console indeks bilgilerini oku
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: https://karaokemuzik.blogspot.com/
          GSC_MAX_POSTS: '80'
        run: python scripts/gsc_index_check.py
      - name: Kaydedilen indeks durumlarını GitHub'a aktar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-status.json
          if ! git diff --cached --quiet; then
            git commit -m "GSC index durumlarini guncelle"
            git push
          fi
